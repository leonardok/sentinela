name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Teste de fumaça (amd64)
        run: |
          docker buildx build --load -t sentinela:ci .
          docker run -d --name sentinela-ci -e SENTINELAS=127.0.0.1 -e NUT_SENHA=ci sentinela:ci
          for i in $(seq 1 15); do
            status=$(docker exec sentinela-ci upsc sentinela@127.0.0.1 ups.status 2>&1 | tail -n 1)
            [ "$status" = "OL" ] && break
            sleep 1
          done
          docker logs sentinela-ci
          echo "status lido: '$status'"
          test "$status" = "OL"
          docker exec sentinela-ci python3 -c "import urllib.request as u; assert u.urlopen('http://127.0.0.1:8493/saude').read() == b'ok\n'"
          docker exec sentinela-ci python3 -c "
          import urllib.request as u, urllib.error as e
          try: u.urlopen('http://127.0.0.1:8493/'); raise SystemExit('painel sem senha!')
          except e.HTTPError as x: assert x.code == 401"

      - name: Teste de ponta a ponta (falta de luz simulada)
        run: IMG=sentinela:ci SKIP_BUILD=1 ./scripts/teste-docker.sh

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
