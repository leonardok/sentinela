# Sentinela num Raspberry Pi (ou outro equipamento que NÃO é o servidor).
# Além de avisar o TrueNAS, manda Wake-on-LAN quando a energia volta.
# O Pi deve ficar FORA do nobreak: quando a luz volta, ele liga e acorda o NAS.
#
# Depois de subir, abra http://IP-DO-PI:8493 (senha: NUT_SENHA) e configure as
# sentinelas, o controle e o MAC do NAS na seção Wake-on-LAN.
services:
  sentinela:
    image: ghcr.io/leonardok/sentinela:latest
    restart: unless-stopped
    network_mode: host     # necessário para o broadcast do Wake-on-LAN
    cap_add:
      - NET_RAW
    volumes:
      - ./config:/config
    environment:
      NUT_USUARIO: "monitor"
      NUT_SENHA: "troque-esta-senha"
      # O Pi liga junto com a energia: já começa mandando WoL.
      WOL_AO_INICIAR: "true"
      TZ: "America/Sao_Paulo"
