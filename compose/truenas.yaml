# Sentinela no TrueNAS: Apps → Discover Apps → ⋮ → Install via YAML.
#
# Só a senha é obrigatória aqui. IPs e tempos se configuram depois na
# interface web, pelo botão "Web UI" na página do app (usuário: qualquer um,
# senha: NUT_SENHA). Em seguida configure o serviço de UPS do TrueNAS em modo
# remoto apontando para 127.0.0.1:3493 (veja o README).
#
# Atenção: o botão "Web UI" (x-portals) só aparece se este bloco estiver no
# YAML quando o app é CRIADO. Se faltar, apague e instale o app de novo.
services:
  sentinela:
    image: ghcr.io/leonardok/sentinela:latest
    restart: unless-stopped
    ports:
      - "3493:3493"        # NUT, para o serviço de UPS do TrueNAS
      - "8493:8493"        # interface web
    cap_add:
      - NET_RAW            # ping
    volumes:
      - config:/config     # configuração salva pela interface
    environment:
      NUT_USUARIO: "monitor"
      NUT_SENHA: "troque-esta-senha"
      TZ: "America/Sao_Paulo"

volumes:
  config:

x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 8493
    path: /
