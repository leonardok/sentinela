# Sentinela no TrueNAS (Apps → Discover Apps → ⋮ → Install via YAML).
# Depois configure o serviço de UPS do TrueNAS em modo remoto apontando para
# 127.0.0.1:3493 (veja o README).
services:
  sentinela:
    image: ghcr.io/leonardok/sentinela:latest
    restart: unless-stopped
    ports:
      - "3493:3493"
    cap_add:
      - NET_RAW            # ping
    environment:
      # Equipamentos SEM nobreak. Se todos ficarem mudos, é falta de luz.
      SENTINELAS: "192.168.1.2,192.168.1.3"
      # Equipamento NO nobreak (switch/roteador do NAS). Se ele também sumir,
      # é problema de rede e nada acontece. Recomendado.
      CONTROLE: "192.168.1.1"
      # Segundos sem sentinelas antes de entrar "na bateria".
      CARENCIA: "60"
      # Segundos "na bateria" antes da bateria baixa (quando o TrueNAS desliga).
      AUTONOMIA: "240"
      # Usuário e senha que o serviço de UPS do TrueNAS vai usar.
      NUT_USUARIO: "monitor"
      NUT_SENHA: "troque-esta-senha"
      TZ: "America/Sao_Paulo"
